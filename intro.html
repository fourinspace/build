<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vimeo Full Width</title>
    <style>
        /* Remove default spacing and allow vertical scrolling if needed */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #000;
        }

        /* Container spans 100% of the width. 
           aspect-ratio ensures the height scales perfectly with the width.
        */
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9; 
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The iframe fills the container completely */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182375605?background=1&autopause=0" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
