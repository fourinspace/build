<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Avoidance UI</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Video Container - Center Scaled */
        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        /* Bar Containers */
        .bar-trigger {
            position: fixed;
            left: 0;
            width: 100%;
            height: 150px; /* Trigger height */
            z-index: 10;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .top-trigger { top: 0; }
        .bottom-trigger { bottom: 0; }

        /* General Bar Movement: Push the whole bar away on hover */
        .top-trigger:hover { transform: translateY(-30px); }
        .bottom-trigger:hover { transform: translateY(30px); }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: #ff0055; /* The pink from your sample */
        }

        path {
            transition: d 0.15s ease-out; /* Fast reaction to follow mouse */
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="bar-trigger top-trigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="topPath" d="M0,0 L1000,0 L1000,100 Q500,100 0,100 Z" />
        </svg>
    </div>

    <div class="bar-trigger bottom-trigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="bottomPath" d="M0,50 L1000,50 L1000,150 L0,150 Q500,50 0,50 Z" />
        </svg>
    </div>

    <script>
        const topPath = document.getElementById('topPath');
        const bottomPath = document.getElementById('bottomPath');
        const triggers = document.querySelectorAll('.bar-trigger');

        triggers.forEach(trigger => {
            const isTop = trigger.classList.contains('top-trigger');
            const path = isTop ? topPath : bottomPath;

            trigger.addEventListener('mousemove', (e) => {
                const rect = trigger.getBoundingClientRect();
                // Calculate mouse X as a percentage of the 1000 unit viewBox
                const x = ((e.clientX - rect.left) / rect.width) * 1000;
                
                if (isTop) {
                    // "Avoidance": The curve point moves UP where the mouse is
                    path.setAttribute('d', `M0,0 L1000,0 L1000,100 Q${x},20 0,100 Z`);
                } else {
                    // "Avoidance": The curve point moves DOWN where the mouse is
                    path.setAttribute('d', `M0,50 L1000,50 L1000,150 L0,150 Q${x},130 0,50 Z`);
                }
            });

            trigger.addEventListener('mouseleave', () => {
                // Reset to flat/neutral state
                if (isTop) {
                    path.setAttribute('d', "M0,0 L1000,0 L1000,100 Q500,100 0,100 Z");
                } else {
                    path.setAttribute('d', "M0,50 L1000,50 L1000,150 L0,150 Q500,50 0,50 Z");
                }
            });
        });
    </script>
</body>
</html>
