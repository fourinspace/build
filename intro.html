<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic UI Full Width</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* 1. Video fills the width, maintains 16:9 ratio */
        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        /* 2. Interactive Bar Containers */
        .bar-trigger {
            position: fixed;
            left: 0;
            width: 100%;
            height: 25vh; /* Large trigger area for the pointer */
            z-index: 10;
            display: flex;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .top-trigger { top: 0; align-items: flex-start; }
        .bottom-trigger { bottom: 0; align-items: flex-end; }

        /* Movement: Push away when pointer comes close */
        .top-trigger:hover { transform: translateY(-40px); }
        .bottom-trigger:hover { transform: translateY(40px); }

        svg {
            width: 100%;
            height: 120px; /* Height of the pink bar */
            fill: #ff0055; /* The pink from your sample */
        }

        path {
            transition: d 0.3s ease-out; /* Smooths the 'allergic' rounding */
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="bar-trigger top-trigger">
        <svg viewBox="0 0 1000 100" preserveAspectRatio="none">
            <path id="topPath" d="M0,0 L1000,0 L1000,80 Q500,80 0,80 Z" />
        </svg>
    </div>

    <div class="bar-trigger bottom-trigger">
        <svg viewBox="0 0 1000 100" preserveAspectRatio="none">
            <path id="bottomPath" d="M0,20 L1000,20 L1000,100 L0,100 Q500,20 0,20 Z" />
        </svg>
    </div>

    <script>
        const topPath = document.getElementById('topPath');
        const bottomPath = document.getElementById('bottomPath');
        const topTrigger = document.querySelector('.top-trigger');
        const bottomTrigger = document.querySelector('.bottom-trigger');

        // Function to create the 'allergic reaction' curve at mouse X
        const updateCurve = (e, path, isTop) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 1000;
            
            if (isTop) {
                // Bulge downwards
                path.setAttribute('d', `M0,0 L1000,0 L1000,60 Q${x},120 0,60 Z`);
            } else {
                // Bulge upwards
                path.setAttribute('d', `M0,40 L1000,40 L1000,100 L0,100 Q${x},-20 0,40 Z`);
            }
        };

        const resetCurve = (path, isTop) => {
            if (isTop) {
                path.setAttribute('d', "M0,0 L1000,0 L1000,80 Q500,80 0,80 Z");
            } else {
                path.setAttribute('d', "M0,20 L1000,20 L1000,100 L0,100 Q500,20 0,20 Z");
            }
        };

        topTrigger.addEventListener('mousemove', (e) => updateCurve(e, topPath, true));
        topTrigger.addEventListener('mouseleave', () => resetCurve(topPath, true));

        bottomTrigger.addEventListener('mousemove', (e) => updateCurve(e, bottomPath, false));
        bottomTrigger.addEventListener('mouseleave', () => resetCurve(bottomPath, false));
    </script>
</body>
</html>
