<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vimeo Loop Background</title>
    <style>
        /* 1. Center everything in the middle of the screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        /* 2. Scalable Container */
        .video-container {
            position: relative;
            width: 80vw; /* Scales with the viewport width */
            aspect-ratio: 16 / 9; /* Maintains video proportions */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. The Video Frame */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
