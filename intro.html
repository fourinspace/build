<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTA - Travel Without Moving</title>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Krona+One', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video Container */
        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        /* Typewriter Overlay */
        .overlay-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: opacity 0.3s ease;
        }

        #typewriter-text {
            color: #fff;
            font-weight: bold;
            font-size: 3rem;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .signin-btn {
            background-color: #4285f4;
            color: white;
            padding: 8px 22px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-family: 'Arial', sans-serif;
        }

        /* The Closing Pink Bars */
        .bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 50vh; /* Meet in the middle */
            background-color: #c64c9f;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .top-bar { 
            top: 0; 
            transform: translateY(-100%); /* Start off-screen */
        }
        .bottom-bar { 
            bottom: 0; 
            transform: translateY(100%); /* Start off-screen */
        }

        /* Open state (Bars showing slightly as margins) */
        body.content-active .top-bar { transform: translateY(-38vh); } /* Adjust based on bar height */
        body.content-active .bottom-bar { transform: translateY(38vh); }

        /* Closing state (Triggered on click) */
        body.bars-closed .top-bar,
        body.bars-closed .bottom-bar { transform: translateY(0); }

        /* Trigger Zones */
        .trigger-zone {
            position: fixed;
            left: 0;
            width: 100%;
            height: 15vh;
            z-index: 15;
        }
        .top-trigger { top: 0; }
        .bottom-trigger { bottom: 0; }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            background-color: #fff;
            border-radius: 8px;
            z-index: 20;
            padding: 40px;
            display: none; /* Hidden by default */
            flex-direction: column;
            font-family: 'Arial', sans-serif;
        }

        .logo-container { text-align: left; margin-bottom: 20px; }
        .dta-logo { height: 35px; }

        .login-title { font-size: 24px; color: #202124; margin-bottom: 8px; font-weight: 400; }
        .login-subtitle { font-size: 16px; color: #202124; margin-bottom: 30px; }

        .login-input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 20px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .login-input:focus {
            outline: none;
            border: 2px solid #1a73e8;
            padding: 12px 14px;
        }

        .login-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .forgot-link { color: #1a73e8; font-weight: bold; text-decoration: none; font-size: 14px; }

        .next-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .cursor { display: inline-block; width: 10px; background-color: #fff; margin-left: 5px; animation: blink 0.7s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    </style>
</head>
<body class="content-active">

    <div class="video-container" id="vid-bg">
        <iframe src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="overlay-content" id="main-ui">
        <div><span id="typewriter-text"></span><span class="cursor">&nbsp;</span></div>
        <button class="signin-btn" id="trigger-signin">Sign in</button>
    </div>

    <div class="trigger-zone top-trigger"></div>
    <div class="bar top-bar"></div>

    <div class="trigger-zone bottom-trigger"></div>
    <div class="bar bottom-bar"></div>

    <div class="login-screen" id="login-box">
        <div class="logo-container">
            <img src="https://lh3.googleusercontent.com/d/1IoX441g-72AXxBkgREDu5YLqEaHwEinS=w1200" alt="DTA Logo" class="dta-logo">
        </div>
        <div class="login-title">Sign in</div>
        <div class="login-subtitle">Use your DTA Account</div>

        <input type="text" class="login-input" placeholder="Email or phone">
        <input type="password" id="pass-field" class="login-input" placeholder="Enter your password">

        <div class="login-footer">
            <a href="#" class="forgot-link">Forgot password?</a>
            <button class="next-btn" id="next-action">Next</button>
        </div>
    </div>

    <script>
        // TYPEWRITER
        const textElement = document.getElementById('typewriter-text');
        const phrases = ["best budget travel...", "safest travel...", "most relaxing...", "travel without moving."];
        let pIdx = 0, cIdx = 0, isDel = false;

        function typeEffect() {
            const full = phrases[pIdx];
            textElement.textContent = isDel ? full.substring(0, cIdx--) : full.substring(0, cIdx++);
            let speed = isDel ? 50 : 100;

            if (!isDel && cIdx > full.length) {
                if (pIdx === phrases.length - 1) return;
                isDel = true; speed = 1500;
            } else if (isDel && cIdx < 0) {
                isDel = false; pIdx++; cIdx = 0; speed = 500;
            }
            setTimeout(typeEffect, speed);
        }
        setTimeout(typeEffect, 1000);

        // TRANSITION LOGIC
        const signBtn = document.getElementById('trigger-signin');
        const loginBox = document.getElementById('login-box');
        const mainUI = document.getElementById('main-ui');
        const vidBg = document.getElementById('vid-bg');
        const nextBtn = document.getElementById('next-action');
        const passField = document.getElementById('pass-field');

        signBtn.addEventListener('click', () => {
            // 1. Close bars
            document.body.classList.remove('content-active');
            document.body.classList.add('bars-closed');

            // 2. Wait for bars to cover screen, then switch content
            setTimeout(() => {
                mainUI.style.display = 'none';
                vidBg.style.display = 'none';
                loginBox.style.display = 'flex';
                
                // 3. Open bars back up to reveal login
                document.body.classList.remove('bars-closed');
                document.body.style.backgroundColor = '#f0f2f5'; // Light grey like the image
            }, 600);
        });

        // PASSWORD CHECK
        nextBtn.addEventListener('click', () => {
            if (passField.value === '123456789') {
                alert('Access Granted');
            } else {
                alert('Wrong password. Try again.');
                passField.value = '';
            }
        });
    </script>
</body>
</html>
