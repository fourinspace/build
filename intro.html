<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Wave Interface</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        .bar-trigger {
            position: fixed;
            left: 0;
            width: 100%;
            height: 30vh; /* Large detection area */
            z-index: 10;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-trigger { top: 0; transform: translateY(35px); }
        .bottom-trigger { bottom: 0; transform: translateY(-35px); }

        /* Push entire bar away when pointer is in the zone */
        .top-trigger:hover { transform: translateY(-45px); }
        .bottom-trigger:hover { transform: translateY(45px); }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: #ff0055;
        }

        path {
            /* No CSS transition here; the JavaScript loop handles the smoothness to prevent flickering */
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="bar-trigger top-trigger" id="topTrigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="topPath" d="M0,0 L1000,0 L1000,100 L0,100 Z" />
        </svg>
    </div>

    <div class="bar-trigger bottom-trigger" id="bottomTrigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="bottomPath" d="M0,50 L1000,50 L1000,150 L0,150 Z" />
        </svg>
    </div>

    <script>
        const topPath = document.getElementById('topPath');
        const bottomPath = document.getElementById('bottomPath');
        
        let mouseX = 500;
        let topActive = false;
        let bottomActive = false;
        let time = 0;

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 1000;
        });

        // Independent triggers for top and bottom
        document.getElementById('topTrigger').addEventListener('mouseenter', () => topActive = true);
        document.getElementById('topTrigger').addEventListener('mouseleave', () => topActive = false);
        document.getElementById('bottomTrigger').addEventListener('mouseenter', () => bottomActive = true);
        document.getElementById('bottomTrigger').addEventListener('mouseleave', () => bottomActive = false);

        // Smooth values to prevent flickering
        let currentTopX = 500, currentTopH = 0;
        let currentBottomX = 500, currentBottomH = 0;

        function animate() {
            time += 0.015;
            
            // 1. Automatic Breathing Wave
            const autoX = 500 + Math.sin(time * 0.7) * 250;
            const autoH = 15 + Math.sin(time) * 10;

            // 2. Logic for Top Bar (Independent)
            let targetTopX = topActive ? mouseX : autoX;
            let targetTopH = topActive ? 70 : autoH;
            // Interpolation for smoothness
            currentTopX += (targetTopX - currentTopX) * 0.1;
            currentTopH += (targetTopH - currentTopH) * 0.1;

            // 3. Logic for Bottom Bar (Independent)
            let targetBottomX = bottomActive ? mouseX : autoX;
            let targetBottomH = bottomActive ? 70 : autoH;
            currentBottomX += (targetBottomX - currentBottomX) * 0.1;
            currentBottomH += (targetBottomH - currentBottomH) * 0.1;

            renderPath(topPath, true, currentTopX, currentTopH);
            renderPath(bottomPath, false, currentBottomX, currentBottomH);

            requestAnimationFrame(animate);
        }

        function renderPath(path, isTop, x, h) {
            const base = isTop ? 100 : 50;
            const r = 300; // Wide organic radius

            if (isTop) {
                path.setAttribute('d', `
                    M0,0 L1000,0 L1000,${base} 
                    L${x + r},${base} 
                    C${x + r/2},${base} ${x + r/4},${base - h} ${x},${base - h}
                    C${x - r/4},${base - h} ${x - r/2},${base} ${x - r},${base}
                    L0,${base} Z
                `);
            } else {
                path.setAttribute('d', `
                    M0,${base} L${x - r},${base} 
                    C${x - r/2},${base} ${x - r/4},${base + h} ${x},${base + h}
                    C${x + r/4},${base + h} ${x + r/2},${base} ${x + r},${base}
                    L1000,${base} L1000,150 L0,150 Z
                `);
            }
        }

        animate();
    </script>
</body>
</html>
