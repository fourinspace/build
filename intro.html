<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Breathing Wave UI</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        /* Default position sits closer to the center for better visibility of the push */
        .bar-trigger {
            position: fixed;
            left: 0;
            width: 100%;
            height: 250px;
            z-index: 10;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-trigger { top: 0; transform: translateY(30px); }
        .bottom-trigger { bottom: 0; transform: translateY(-30px); }

        /* Global push-away when pointer enters the zone */
        .top-trigger:hover { transform: translateY(-40px); }
        .bottom-trigger:hover { transform: translateY(40px); }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: #ff0055;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="bar-trigger top-trigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="topPath" d="M0,0 L1000,0 L1000,100 L0,100 Z" />
        </svg>
    </div>

    <div class="bar-trigger bottom-trigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="bottomPath" d="M0,50 L1000,50 L1000,150 L0,150 Z" />
        </svg>
    </div>

    <script>
        const topPath = document.getElementById('topPath');
        const bottomPath = document.getElementById('bottomPath');
        
        let mouseX = -1000; // Keep off-screen initially
        let isHovering = false;
        let time = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 1000;
        });

        document.querySelectorAll('.bar-trigger').forEach(trig => {
            trig.addEventListener('mouseenter', () => isHovering = true);
            trig.addEventListener('mouseleave', () => isHovering = false);
        });

        function animate() {
            time += 0.02; // Speed of the automatic wave
            
            // Automatic Wave Calculation (Sinusoidal)
            const autoWaveHeight = Math.sin(time) * 15; 
            const autoWaveX = 500 + Math.cos(time * 0.5) * 200; // The automatic wave moves side to side

            // Render Top Bar
            renderPath(topPath, true, autoWaveX, autoWaveHeight);
            // Render Bottom Bar
            renderPath(bottomPath, false, autoWaveX, autoWaveHeight);

            requestAnimationFrame(animate);
        }

        function renderPath(path, isTop, autoX, autoH) {
            const baseLine = isTop ? 100 : 50;
            const r = 250; // Radius of the wave
            const pushDepth = isHovering ? 60 : 0;
            
            // We blend the automatic wave with the cursor push
            // If hovering, use mouseX, otherwise influence by autoX
            const targetX = isHovering ? mouseX : autoX;
            const targetH = isHovering ? pushDepth : autoH;

            // Smooth cubic bezier that creates a 'dip and rise'
            if (isTop) {
                path.setAttribute('d', `
                    M0,0 L1000,0 L1000,${baseLine} 
                    L${targetX + r},${baseLine} 
                    C${targetX + r/2},${baseLine} ${targetX + r/4},${baseLine - targetH} ${targetX},${baseLine - targetH}
                    C${targetX - r/4},${baseLine - targetH} ${targetX - r/2},${baseLine} ${targetX - r},${baseLine}
                    L0,${baseLine} Z
                `);
            } else {
                path.setAttribute('d', `
                    M0,${baseLine} L${targetX - r},${baseLine} 
                    C${targetX - r/2},${baseLine} ${targetX - r/4},${baseLine + targetH} ${targetX},${baseLine + targetH}
                    C${targetX + r/4},${baseLine + targetH} ${targetX + r/2},${baseLine} ${targetX + r},${baseLine}
                    L1000,${baseLine} L1000,150 L0,150 Z
                `);
            }
        }

        animate();
    </script>
</body>
</html>
