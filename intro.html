<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Intersecting Video Bars</title>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Krona+One', sans-serif;
        }

        /* Video Container - Flat and Stationary */
        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            border-radius: 0; 
            overflow: hidden;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        /* Centered Typewriter Text */
        .typewriter-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20; /* Above the bars */
            text-align: center;
            width: 100%;
            pointer-events: none;
        }

        #typewriter-text {
            color: #fff;
            font-family: 'Krona One', sans-serif;
            font-weight: bold;
            font-size: 3rem;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        /* Blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #fff;
            margin-left: 5px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 120px;
            background-color: #c64c9f;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-bar { top: 0; }
        .bottom-bar { 
            bottom: 0; 
            transform-origin: center bottom; 
        }

        .trigger-zone {
            position: fixed;
            left: 0;
            width: 100%;
            height: 20vh;
            z-index: 15;
        }

        .top-trigger { top: 0; }
        .bottom-trigger { bottom: 0; }

        .top-trigger:hover ~ .top-bar { transform: translateY(-50px); }
        .bottom-trigger:hover ~ .bottom-bar { transform: translateY(50px); }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="typewriter-container">
        <span id="typewriter-text"></span><span class="cursor">&nbsp;</span>
    </div>

    <div class="trigger-zone top-trigger"></div>
    <div class="bar top-bar"></div>

    <div class="trigger-zone bottom-trigger"></div>
    <div class="bar bottom-bar"></div>

    <script>
        const textElement = document.getElementById('typewriter-text');
        const phrases = [
            "best budget travel...",
            "safest travel...",
            "most relaxing...",
            "travel without moving."
        ];
        
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typeSpeed = 100;

        function type() {
            const currentPhrase = phrases[phraseIndex];
            
            if (isDeleting) {
                // Backspacing logic
                textElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
                typeSpeed = 50; 
            } else {
                // Typing logic
                textElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
                typeSpeed = 100;
            }

            // Determine when to switch to deleting or next phrase
            if (!isDeleting && charIndex === currentPhrase.length) {
                // Pause at the end of a phrase (except the last one)
                if (phraseIndex === phrases.length - 1) {
                    return; // Stop animation on the final phrase
                }
                isDeleting = true;
                typeSpeed = 1500; // Wait before starting to backspace
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex++;
                typeSpeed = 500; // Short break before typing next phrase
            }

            setTimeout(type, typeSpeed);
        }

        // Start the animation
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(type, 1000); // Initial delay
        });
    </script>

</body>
</html>
