<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Organic Waves</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        .bar-trigger {
            position: fixed;
            left: 0;
            width: 100%;
            height: 35vh;
            z-index: 10;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-trigger { top: 0; transform: translateY(35px); }
        .bottom-trigger { bottom: 0; transform: translateY(-35px); }

        .top-trigger:hover { transform: translateY(-40px); }
        .bottom-trigger:hover { transform: translateY(40px); }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: #ff0055;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="bar-trigger top-trigger" id="topTrigger">
        <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
            <path id="topPath" d="M0,0 L1000,0 L1000,100 L0,100 Z" />
        </svg>
    </div>

    <div class="bar-trigger bottom-trigger" id="bottomTrigger">
        <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
            <path id="bottomPath" d="M0,100 L1000,100 L1000,200 L0,200 Z" />
        </svg>
    </div>

    <script>
        const topPath = document.getElementById('topPath');
        const bottomPath = document.getElementById('bottomPath');
        
        let mouseX = -500;
        let topActive = false, bottomActive = false;
        let time = 0;

        // Current pointer "strength" (to fade the extra wave in/out)
        let topStrength = 0, bottomStrength = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 1000;
        });

        document.getElementById('topTrigger').addEventListener('mouseenter', () => topActive = true);
        document.getElementById('topTrigger').addEventListener('mouseleave', () => topActive = false);
        document.getElementById('bottomTrigger').addEventListener('mouseenter', () => bottomActive = true);
        document.getElementById('bottomTrigger').addEventListener('mouseleave', () => bottomActive = false);

        function animate() {
            time += 0.02;

            // 1. Permanent Auto-Wave (Breathing)
            const autoX = 500 + Math.sin(time * 0.4) * 350;
            const autoH = 20 + Math.sin(time * 0.8) * 10;

            // 2. Extra Pointer-Wave Strength (Smooth fade)
            topStrength += ((topActive ? 75 : 0) - topStrength) * 0.1;
            bottomStrength += ((bottomActive ? 75 : 0) - bottomStrength) * 0.1;

            // 3. Render
            renderLayeredWave(topPath, true, autoX, autoH, mouseX, topStrength);
            renderLayeredWave(bottomPath, false, autoX, autoH, mouseX, bottomStrength);

            requestAnimationFrame(animate);
        }

        function renderLayeredWave(path, isTop, aX, aH, pX, pStrength) {
            const base = 100;
            const r = 240; // Wave radius
            
            // We build the path by combining the auto-wave AND the pointer-wave
            // Pointer effect is an offset added on top of the base logic
            
            if (isTop) {
                path.setAttribute('d', `
                    M0,0 L1000,0 L1000,${base} 
                    L${aX + r},${base} 
                    C${aX + r/2},${base} ${aX + r/3},${base + aH} ${aX},${base - aH}
                    C${aX - r/3},${base - aH} ${aX - r/2},${base} ${aX - r},${base}
                    M${pX + r},${base} 
                    C${pX + r/2},${base} ${pX + r/4},${base + pStrength/2} ${pX},${base - pStrength}
                    C${pX - r/4},${base - pStrength} ${pX - r/2},${base + pStrength/2} ${pX - r},${base}
                    L0,${base} Z
                `);
            } else {
                path.setAttribute('d', `
                    M0,${base} L${aX - r},${base} 
                    C${aX - r/2},${base} ${aX - r/3},${base - aH} ${aX},${base + aH}
                    C${aX + r/3},${base + aH} ${aX + r/2},${base} ${aX + r},${base}
                    M${pX - r},${base} 
                    C${pX - r/2},${base} ${pX - r/4},${base - pStrength/2} ${pX},${base + pStrength}
                    C${pX + r/4},${base + pStrength} ${pX + r/2},${base - pStrength/2} ${pX + r},${base}
                    L1000,${base} L1000,200 L0,200 Z
                `);
            }
        }

        animate();
    </script>
</body>
</html>
