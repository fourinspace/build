<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Fluid Wave UI</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        /* The bar is lower/centered by default, and lifts up on hover */
        .bar-trigger {
            position: fixed;
            left: 0;
            width: 100%;
            height: 180px;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-trigger { 
            top: 0; 
            transform: translateY(0px); /* Default position closer to center */
        }
        .bottom-trigger { 
            bottom: 0; 
            transform: translateY(0px); 
        }

        /* Lift the bar AWAY from the pointer as it enters the zone */
        .top-trigger:hover { transform: translateY(-40px); }
        .bottom-trigger:hover { transform: translateY(40px); }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: #ff0055;
        }

        path {
            transition: d 0.2s ease-out; /* Smooth wave following */
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="bar-trigger top-trigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="topPath" d="M0,0 L1000,0 L1000,100 L0,100 Z" />
        </svg>
    </div>

    <div class="bar-trigger bottom-trigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="bottomPath" d="M0,50 L1000,50 L1000,150 L0,150 Z" />
        </svg>
    </div>

    <script>
        const topPath = document.getElementById('topPath');
        const bottomPath = document.getElementById('bottomPath');
        const triggers = document.querySelectorAll('.bar-trigger');

        triggers.forEach(trigger => {
            const isTop = trigger.classList.contains('top-trigger');
            const path = isTop ? topPath : bottomPath;

            trigger.addEventListener('mousemove', (e) => {
                const rect = trigger.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 1000;
                
                // r: Radius of the wave influence (Wide and soft)
                // d: Peak height of the avoidance curve
                const r = 250; 
                const d = 45; 

                if (isTop) {
                    // Smooth Bell Curve Path
                    path.setAttribute('d', `
                        M0,0 L1000,0 L1000,100 
                        L${x + r},100 
                        C${x + r/2},100 ${x + r/3},${100 - d} ${x},${100 - d}
                        C${x - r/3},${100 - d} ${x - r/2},100 ${x - r},100
                        L0,100 Z
                    `);
                } else {
                    path.setAttribute('d', `
                        M0,50 L${x - r},50 
                        C${x - r/2},50 ${x - r/3},${50 + d} ${x},${50 + d}
                        C${x + r/3},${50 + d} ${x + r/2},50 ${x + r},50
                        L1000,50 L1000,150 L0,150 Z
                    `);
                }
            });

            trigger.addEventListener('mouseleave', () => {
                if (isTop) {
                    path.setAttribute('d', "M0,0 L1000,0 L1000,100 L0,100 Z");
                } else {
                    path.setAttribute('d', "M0,50 L1000,50 L1000,150 L0,150 Z");
                }
            });
        });
    </script>
</body>
</html>
