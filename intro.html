<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Bi-Directional Wave</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        .bar-trigger {
            position: fixed;
            left: 0;
            width: 100%;
            height: 35vh;
            z-index: 10;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-trigger { top: 0; transform: translateY(30px); }
        .bottom-trigger { bottom: 0; transform: translateY(-30px); }

        .top-trigger:hover { transform: translateY(-40px); }
        .bottom-trigger:hover { transform: translateY(40px); }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: #ff0055;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="bar-trigger top-trigger" id="topTrigger">
        <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
            <path id="topPath" d="M0,0 L1000,0 L1000,100 L0,100 Z" />
        </svg>
    </div>

    <div class="bar-trigger bottom-trigger" id="bottomTrigger">
        <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
            <path id="bottomPath" d="M0,100 L1000,100 L1000,200 L0,200 Z" />
        </svg>
    </div>

    <script>
        const topPath = document.getElementById('topPath');
        const bottomPath = document.getElementById('bottomPath');
        
        let mouseX = 500;
        let topActive = false, bottomActive = false;
        let time = 0;

        // Smoothing variables to prevent flickering
        let tX = 500, tH = 0, bX = 500, bH = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 1000;
        });

        document.getElementById('topTrigger').addEventListener('mouseenter', () => topActive = true);
        document.getElementById('topTrigger').addEventListener('mouseleave', () => topActive = false);
        document.getElementById('bottomTrigger').addEventListener('mouseenter', () => bottomActive = true);
        document.getElementById('bottomTrigger').addEventListener('mouseleave', () => bottomActive = false);

        function animate() {
            time += 0.02;

            // 1. Automated "Breathing" Wave logic
            const autoX = 500 + Math.sin(time * 0.5) * 300;
            const autoH = 20 + Math.sin(time) * 15;

            // 2. Transition logic (Interpolation)
            tX += ((topActive ? mouseX : autoX) - tX) * 0.1;
            tH += ((topActive ? 70 : autoH) - tH) * 0.1;
            
            bX += ((bottomActive ? mouseX : autoX) - bX) * 0.1;
            bH += ((bottomActive ? 70 : autoH) - bH) * 0.1;

            // 3. Render dual-direction paths
            renderDualWave(topPath, true, tX, tH);
            renderDualWave(bottomPath, false, bX, bH);

            requestAnimationFrame(animate);
        }

        function renderDualWave(path, isTop, x, h) {
            const base = 100; // Middle of the SVG height
            const r = 250;   // The total width of the wave effect
            
            // h is the total vertical displacement
            // One side pushes up (h), the other pulls down (-h)
            
            if (isTop) {
                // Top Bar: Pushes up into the bar, pulls down into the video
                path.setAttribute('d', `
                    M0,0 L1000,0 L1000,${base} 
                    L${x + r},${base} 
                    C${x + r/2},${base} ${x + r/3},${base + h/1.5} ${x + r/4},${base + h/1.5}
                    C${x + r/6},${base + h/1.5} ${x + r/8},${base - h} ${x},${base - h}
                    C${x - r/8},${base - h} ${x - r/6},${base - h/2} ${x - r/4},${base + h/2}
                    C${x - r/2},${base + h} ${x - r/1.2},${base} ${x - r},${base}
                    L0,${base} Z
                `);
            } else {
                // Bottom Bar: Pushes down into the bar, pulls up into the video
                path.setAttribute('d', `
                    M0,${base} L${x - r},${base} 
                    C${x - r/2},${base} ${x - r/3},${base - h/1.5} ${x - r/4},${base - h/1.5}
                    C${x - r/6},${base - h/1.5} ${x - r/8},${base + h} ${x},${base + h}
                    C${x + r/8},${base + h} ${x + r/6},${base + h/2} ${x + r/4},${base - h/2}
                    C${x + r/2},${base - h} ${x + r/1.2},${base} ${x + r},${base}
                    L1000,${base} L1000,200 L0,200 Z
                `);
            }
        }

        animate();
    </script>
</body>
</html>
