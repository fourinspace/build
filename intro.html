<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Wave Avoidance</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        .bar-trigger {
            position: fixed;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .top-trigger { top: 0; }
        .bottom-trigger { bottom: 0; }

        .top-trigger:hover { transform: translateY(-20px); }
        .bottom-trigger:hover { transform: translateY(20px); }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: #ff0055;
        }

        path {
            transition: d 0.15s ease-out;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="bar-trigger top-trigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="topPath" d="M0,0 L1000,0 L1000,100 L0,100 Z" />
        </svg>
    </div>

    <div class="bar-trigger bottom-trigger">
        <svg viewBox="0 0 1000 150" preserveAspectRatio="none">
            <path id="bottomPath" d="M0,50 L1000,50 L1000,150 L0,150 Z" />
        </svg>
    </div>

    <script>
        const topPath = document.getElementById('topPath');
        const bottomPath = document.getElementById('bottomPath');
        const triggers = document.querySelectorAll('.bar-trigger');

        triggers.forEach(trigger => {
            const isTop = trigger.classList.contains('top-trigger');
            const path = isTop ? topPath : bottomPath;

            trigger.addEventListener('mousemove', (e) => {
                const rect = trigger.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 1000;
                
                // radius: Doubled the width as requested (was 60, now 120)
                const r = 120; 
                const d = 50;  // Vertical depth of the push
                const dip = 15; // How much the sides "pull down"

                if (isTop) {
                    // M0,0 L1000,0 L1000,100 -> Flat part
                    // L${x + r},100 -> Start of the bend
                    // First C: Pulls down slightly (100 + dip)
                    // Second C: Pushes up at center (100 - d)
                    // Third C: Pulls down slightly on other side (100 + dip)
                    path.setAttribute('d', `
                        M0,0 L1000,0 L1000,100 
                        L${x + r},100 
                        C${x + r * 0.7},100 ${x + r * 0.5},${100 + dip} ${x + r * 0.3},${100 + dip}
                        C${x + r * 0.1},${100 + dip} ${x + r * 0.1},${100 - d} ${x},${100 - d}
                        C${x - r * 0.1},${100 - d} ${x - r * 0.1},${100 + dip} ${x - r * 0.3},${100 + dip}
                        C${x - r * 0.5},${100 + dip} ${x - r * 0.7},100 ${x - r},100
                        L0,100 Z
                    `);
                } else {
                    // Reversed logic for the bottom bar
                    path.setAttribute('d', `
                        M0,50 L${x - r},50 
                        C${x - r * 0.7},50 ${x - r * 0.5},${50 - dip} ${x - r * 0.3},${50 - dip}
                        C${x - r * 0.1},${50 - dip} ${x - r * 0.1},${50 + d} ${x},${50 + d}
                        C${x + r * 0.1},${50 + d} ${x + r * 0.1},${50 - dip} ${x + r * 0.3},${50 - dip}
                        C${x + r * 0.5},${50 - dip} ${x + r * 0.7},50 ${x + r},50
                        L1000,50 L1000,150 L0,150 Z
                    `);
                }
            });

            trigger.addEventListener('mouseleave', () => {
                if (isTop) {
                    path.setAttribute('d', "M0,0 L1000,0 L1000,100 L0,100 Z");
                } else {
                    path.setAttribute('d', "M0,50 L1000,50 L1000,150 L0,150 Z");
                }
            });
        });
    </script>
</body>
</html>
