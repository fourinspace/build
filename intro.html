<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Intersecting Video Bars</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Video Container - Flat and Stationary */
        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            /* 1. Remove the wave behavior by removing the border-radius */
            border-radius: 0; 
            overflow: hidden;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        /* 2. Update the color to match the sample image: #c64c9f */
        .bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 120px;
            background-color: #c64c9f;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-bar { top: 0; }
        .bottom-bar { 
            bottom: 0; 
            /* 1. Remove the organic wave bend by removing the transform-origin */
            transform-origin: center bottom; 
        }

        /* Push the entire bars away when pointer is in the zone */
        /* Increased the trigger area (padding) to make it responsive */
        .trigger-zone {
            position: fixed;
            left: 0;
            width: 100%;
            height: 20vh; /* large detection area */
            z-index: 5;
        }

        .top-trigger { top: 0; }
        .bottom-trigger { bottom: 0; }

        .top-trigger:hover ~ .top-bar { transform: translateY(-50px); }
        .bottom-trigger:hover ~ .bottom-bar { transform: translateY(50px); }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="trigger-zone top-trigger"></div>
    <div class="bar top-bar"></div>

    <div class="trigger-zone bottom-trigger"></div>
    <div class="bar bottom-bar"></div>

</body>
</html>
