<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Intersecting Video Bars</title>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Krona+One', sans-serif;
        }

        /* Video Container - Flat and Stationary */
        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            border-radius: 0; 
            overflow: hidden;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        /* Centered Overlay Container */
        .overlay-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Adjusted gap for smaller button */
            pointer-events: none;
        }

        #typewriter-text {
            color: #fff;
            font-family: 'Krona One', sans-serif;
            font-weight: bold;
            font-size: 3rem;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        /* Sign-in Button Styling - Scaled to 1/2 size */
        .signin-btn {
            background-color: #4285f4;
            color: white;
            padding: 8px 22px; /* Half of original 15px 45px */
            font-size: 1.1rem;  /* Half of original 2.2rem */
            font-weight: bold;
            border: none;
            border-radius: 6px; /* Scaled down corner radius */
            cursor: pointer;
            pointer-events: auto;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-family: 'Arial', sans-serif;
        }

        .signin-btn:hover {
            background-color: #357abd;
        }

        .signin-btn:active {
            transform: scale(0.98);
        }

        /* Blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #fff;
            margin-left: 5px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 120px;
            background-color: #c64c9f;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .top-bar { top: 0; }
        .bottom-bar { 
            bottom: 0; 
            transform-origin: center bottom; 
        }

        .trigger-zone {
            position: fixed;
            left: 0;
            width: 100%;
            height: 20vh;
            z-index: 15;
        }

        .top-trigger { top: 0; }
        .bottom-trigger { bottom: 0; }

        .top-trigger:hover ~ .top-bar { transform: translateY(-50px); }
        .bottom-trigger:hover ~ .bottom-bar { transform: translateY(50px); }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="overlay-content">
        <div>
            <span id="typewriter-text"></span><span class="cursor">&nbsp;</span>
        </div>
        <button class="signin-btn">Sign in</button>
    </div>

    <div class="trigger-zone top-trigger"></div>
    <div class="bar top-bar"></div>

    <div class="trigger-zone bottom-trigger"></div>
    <div class="bar bottom-bar"></div>

    <script>
        const textElement = document.getElementById('typewriter-text');
        const phrases = [
            "best budget travel...",
            "safest travel...",
            "most relaxing...",
            "travel without moving."
        ];
        
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typeSpeed = 100;

        function type() {
            const currentPhrase = phrases[phraseIndex];
            
            if (isDeleting) {
                textElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
                typeSpeed = 50; 
            } else {
                textElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
                typeSpeed = 100;
            }

            if (!isDeleting && charIndex === currentPhrase.length) {
                if (phraseIndex === phrases.length - 1) {
                    return; 
                }
                isDeleting = true;
                typeSpeed = 1500; 
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex++;
                typeSpeed = 500; 
            }

            setTimeout(type, typeSpeed);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(type, 1000); 
        });
    </script>

</body>
</html>
