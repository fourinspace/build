<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Intersecting Video Bars & Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Krona+One', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video Container - Flat and Stationary */
        .video-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 0;
            border-radius: 0; 
            overflow: hidden;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }

        /* State management for main content */
        .content-active .video-container,
        .content-active .overlay-content,
        .content-active .bar {
            opacity: 1;
            pointer-events: auto;
        }

        .login-active .video-container,
        .login-active .overlay-content,
        .login-active .bar {
            opacity: 0;
            pointer-events: none;
        }

        /* Centered Overlay Container (Typewriter/Sign In) */
        .overlay-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #typewriter-text {
            color: #fff;
            font-family: 'Krona One', sans-serif;
            font-weight: bold;
            font-size: 3rem;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        /* Initial Sign-in Button Styling */
        .signin-btn {
            background-color: #4285f4;
            color: white;
            padding: 8px 22px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-family: 'Arial', sans-serif;
        }

        .signin-btn:hover { background-color: #357abd; }
        .signin-btn:active { transform: scale(0.98); }

        /* Blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #fff;
            margin-left: 5px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Colored Bars */
        .bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 120px;
            background-color: #c64c9f;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        }

        .top-bar { top: 0; }
        .bottom-bar { bottom: 0; transform-origin: center bottom; }

        /* Trigger Zones for Bars */
        .trigger-zone {
            position: fixed;
            left: 0;
            width: 100%;
            height: 20vh;
            z-index: 15;
        }

        .top-trigger { top: 0; }
        .bottom-trigger { bottom: 0; }

        .content-active .top-trigger:hover ~ .top-bar { transform: translateY(-50px); }
        .content-active .bottom-trigger:hover ~ .bottom-bar { transform: translateY(50px); }

        /* --- Recreated Login Screen (based on image_1.png) --- */
        .login-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 400px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 30;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            font-family: 'Arial', sans-serif; /* Login screen uses cleaner font */
        }

        .login-active .login-screen {
            opacity: 1;
            pointer-events: auto;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .dta-logo {
            height: 40px;
            width: auto;
        }

        /* Abstract skeletons from image */
        .skeleton-bar-blue {
            width: 200px;
            height: 30px;
            background-color: #7baaf1; /* light blue */
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .skeleton-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .skeleton-circle {
            width: 25px;
            height: 25px;
            background-color: #ccc;
            border-radius: 50%;
        }

        .skeleton-bar-grey {
            width: 200px;
            height: 20px;
            background-color: #ccc;
            border-radius: 10px;
        }

        /* Main input from image */
        .login-input {
            width: 100%;
            height: 60px;
            border: 2px solid #7baaf1; /* input blue border */
            border-radius: 10px;
            background: transparent;
            margin-bottom: 30px;
        }

        /* Bottom section */
        .login-bottom {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skeleton-bar-blue-bottom {
            width: 200px;
            height: 20px;
            background-color: #7baaf1;
            border-radius: 10px;
        }

        .next-btn {
            background-color: #7baaf1;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: #5d8edc;
        }

    </style>
</head>
<body class="content-active">

    <div class="video-container">
        <iframe 
            src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div class="overlay-content">
        <div>
            <span id="typewriter-text"></span><span class="cursor">&nbsp;</span>
        </div>
        <button class="signin-btn" id="show-login">Sign in</button>
    </div>

    <div class="trigger-zone top-trigger"></div>
    <div class="bar top-bar"></div>

    <div class="trigger-zone bottom-trigger"></div>
    <div class="bar bottom-bar"></div>

    <div class="login-screen" id="login-screen">
        <div class="logo-container">
            <img src="https://lh3.googleusercontent.com/d/1IoX441g-72AXxBkgREDu5YLqEaHwEinS=w1200" alt="DTA Logo" class="dta-logo">
        </div>
        
        <div class="skeleton-bar-blue"></div>
        <div class="skeleton-meta">
            <div class="skeleton-circle"></div>
            <div class="skeleton-bar-grey"></div>
        </div>

        <div class="login-input"></div>

        <div class="login-bottom">
            <div class="skeleton-bar-blue-bottom"></div>
            <button class="next-btn">Next</button>
        </div>
    </div>

    <script>
        // --- Typewriter Logic ---
        const textElement = document.getElementById('typewriter-text');
        const phrases = [
            "best budget travel...",
            "safest travel...",
            "most relaxing...",
            "travel without moving."
        ];
        
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typeSpeed = 100;

        function type() {
            const currentPhrase = phrases[phraseIndex];
            
            if (isDeleting) {
                textElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
                typeSpeed = 50; 
            } else {
                textElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
                typeSpeed = 100;
            }

            if (!isDeleting && charIndex === currentPhrase.length) {
                if (phraseIndex === phrases.length - 1) {
                    return; 
                }
                isDeleting = true;
                typeSpeed = 1500; 
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex++;
                typeSpeed = 500; 
            }

            setTimeout(type, typeSpeed);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(type, 1000); 
        });

        // --- Navigation Logic ---
        const body = document.body;
        const signInBtn = document.getElementById('show-login');

        signInBtn.addEventListener('click', () => {
            body.classList.remove('content-active');
            body.classList.add('login-active');
        });
    </script>

</body>
</html>
