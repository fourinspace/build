<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTA - Travel Without Moving</title>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Krona+One', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* STRICT HORIZONTAL FILL - WIDTH IS THE FOCUS */
        .video-container {
            position: fixed;
            top: 50%;
            left: 0;
            width: 100vw !important;
            transform: translateY(-50%);
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .video-container iframe {
            width: 100vw !important;
            height: 56.25vw;
            border: none;
            display: block;
            object-fit: fill;
        }

        /* CENTER CONTENT SHIFTED DOWN TO 75% */
        .overlay-content {
            position: fixed;
            top: 75%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .main-logo {
            width: 240px;
            height: auto;
            margin-bottom: 5px;
            pointer-events: none;
        }

        #typewriter-text {
            color: #fff;
            font-weight: bold;
            font-size: 3rem;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .signin-btn {
            background-color: #4285f4;
            color: white;
            padding: 8px 22px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-family: 'Arial', sans-serif;
            margin-top: 10px;
        }

        /* PINK BARS - HIDDEN UNTIL SIGN IN */
        .bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 50vh; 
            background-color: #c64c9f;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
            pointer-events: none;
        }

        .top-bar { top: 0; transform: translateY(-101%); }
        .bottom-bar { bottom: 0; transform: translateY(101%); }

        body.bars-closed .top-bar { transform: translateY(0); }
        body.bars-closed .bottom-bar { transform: translateY(0); }

        .login-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; 
            height: 300px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 20;
            padding: 30px;
            display: none; 
            flex-direction: column;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
        }

        .login-content { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .logo-container { margin-bottom: 20px; }
        .dta-orange-logo { height: 35px; width: auto; }

        .login-input {
            width: 100%; height: 45px; border: 2px solid #8db5e9; border-radius: 8px;
            background: transparent; margin-bottom: 25px; padding: 0 15px; font-size: 1rem;
            box-sizing: border-box; outline: none;
        }

        .next-btn {
            background-color: #8db5e9; color: white; border: none; padding: 8px 25px;
            border-radius: 5px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
        }

        #loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #8db5e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .cursor { display: inline-block; width: 10px; background-color: #fff; margin-left: 5px; animation: blink 0.7s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    </style>
</head>
<body>

    <div class="video-container" id="vid-bg">
        <iframe src="https://player.vimeo.com/video/1182372586?background=1&autopause=0" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="overlay-content" id="main-ui">
        <img src="https://lh3.googleusercontent.com/d/1X_36F1T5E-09v_hZ5pYm_F9PzUv8s5Jt" alt="DTA Logo" class="main-logo">
        <div><span id="typewriter-text"></span><span class="cursor"> </span></div>
        <button class="signin-btn" id="trigger-signin">Sign in</button>
    </div>

    <div class="bar top-bar"></div>
    <div class="bar bottom-bar"></div>

    <div class="login-screen" id="login-box">
        <div id="login-form-content" class="login-content">
            <div class="logo-container">
                <img src="https://lh3.googleusercontent.com/d/1uR-9zY1g9X6Vl9pL_9v-V5TzX9W6r3l1" alt="DTA Logo" class="dta-orange-logo">
            </div>
            <div style="width: 150px; height: 25px; background-color: #8db5e9; border-radius: 12px; margin-bottom: 10px;"></div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 25px;">
                <div style="width: 20px; height: 20px; background-color: #d1d1d1; border-radius: 50%;"></div>
                <div style="width: 160px; height: 15px; background-color: #d1d1d1; border-radius: 8px;"></div>
            </div>
            <input type="password" id="pass-field" class="login-input" autocomplete="off">
            <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center;">
                <div style="width: 150px; height: 15px; background-color: #8db5e9; border-radius: 8px;"></div>
                <button class="next-btn" id="next-action">Next</button>
            </div>
        </div>
        <div id="loader"></div>
    </div>

    <script>
        const textElement = document.getElementById('typewriter-text');
        const phrases = ["best budget travel...", "safest travel...", "most relaxing...", "travel without moving."];
        let pIdx = 0, cIdx = 0, isDel = false;

        function typeEffect() {
            const full = phrases[pIdx];
            textElement.textContent = isDel ? full.substring(0, cIdx--) : full.substring(0, cIdx++);
            let speed = isDel ? 50 : 100;
            if (!isDel && cIdx > full.length) { if (pIdx === phrases.length - 1) return; isDel = true; speed = 1500; } 
            else if (isDel && cIdx < 0) { isDel = false; pIdx++; cIdx = 0; speed = 500; }
            setTimeout(typeEffect, speed);
        }
        setTimeout(typeEffect, 1000);

        const signBtn = document.getElementById('trigger-signin');
        const loginBox = document.getElementById('login-box');
        const mainUI = document.getElementById('main-ui');
        const vidBg = document.getElementById('vid-bg');
        const nextBtn = document.getElementById('next-action');
        const passField = document.getElementById('pass-field');
        const loginFormContent = document.getElementById('login-form-content');
        const loader = document.getElementById('loader');

        signBtn.addEventListener('click', () => {
            document.body.classList.add('bars-closed');
            setTimeout(() => {
                mainUI.style.display = 'none';
                vidBg.style.display = 'none';
                loginBox.style.display = 'flex';
                document.body.style.backgroundColor = '#c64c9f';
            }, 600);
        });

        nextBtn.addEventListener('click', () => {
            if (passField.value === '123456789') {
                loginFormContent.style.display = 'none';
                loader.style.display = 'block';
                setTimeout(() => { window.location.href = 'index2.html'; }, 1500);
            } else {
                alert('Try again');
                passField.value = '';
            }
        });
    </script>
</body>
</html>
