<!DOCTYPE html>
<html>
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #83b0e1; }
        
        .top-bar-blue { 
            width: 100%; height: 35px; 
            display: flex; align-items: center; overflow: hidden; 
            font-family: 'Andale Mono', 'Courier New', monospace;
        }
        .marquee-container { display: flex; white-space: nowrap; animation: marquee-loop 20s linear infinite; }
        .marquee-text { display: inline-block; color: white; font-size: 14px; letter-spacing: 1px; padding-right: 0px; }
        @keyframes marquee-loop { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body>
    <div class="top-bar-blue">
        <div class="marquee-container">
            <span class="marquee-text">Enter the Puerto Rica Raffle Right Now &nbsp; + &nbsp; Enter the Puerto Rica Raffle Right Now &nbsp; + &nbsp;</span>
            <span class="marquee-text">Enter the Puerto Rica Raffle Right Now &nbsp; + &nbsp; Enter the Puerto Rica Raffle Right Now &nbsp; + &nbsp;</span>
        </div>
    </div>
</body>
</html>
